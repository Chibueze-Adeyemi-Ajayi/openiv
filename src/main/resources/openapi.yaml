openapi: 3.1.0
info:
  title: OpenIV Backend API
  version: 0.1.0
  description: |
    Banking-grade auth and onboarding API.
    This spec is served at `/api/openapi.yaml` **only when `environment=development`**.

servers:
  - url: http://localhost:8080
    description: Local dev

tags:
  - name: Health
  - name: Auth — Onboarding
  - name: Auth — Password
  - name: Auth — Session
  - name: Onboarding — Access Requests
  - name: Team Management

paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      responses:
        '200': { description: Alive, content: { application/json: { schema: { $ref: '#/components/schemas/HealthStatus' } } } }
  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      responses:
        '200': { description: Ready, content: { application/json: { schema: { $ref: '#/components/schemas/HealthStatus' } } } }

  /api/v1/access-requests:
    post:
      tags: [Onboarding — Access Requests]
      summary: Submit a self-service institution access request (public)
      description: |
        Anyone can POST this — no auth. An internal admin reviews and either creates an
        Institution + Invitation pair, or rejects.

        Throttled per contact email: at most 3 submissions per hour for the same email
        (the per-IP global rate limit applies on top).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessRequestSubmit' }
      responses:
        '201':
          description: Submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRequestAck' }
        '400': { $ref: '#/components/responses/AuthError' }
        '429': { $ref: '#/components/responses/AuthError' }

  /api/v1/auth/invite/verify:
    post:
      tags: [Auth — Onboarding]
      summary: Verify an invitation code (does not consume it)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteVerifyRequest' }
      responses:
        '200':
          description: Invite is valid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteVerifyResponse' }
        '400': { $ref: '#/components/responses/AuthError' }

  /api/v1/auth/login:
    post:
      tags: [Auth — Onboarding]
      summary: Log in (and optionally claim an invite on first login)
      description: |
        If `inviteCode` is supplied and valid for `email`, the user account is created with
        `password` as the initial password, the invite is marked accepted, and a session in
        state `pending_email_verification` is returned.
        Otherwise, existing credentials are validated and a session is returned in the state
        appropriate to the user's onboarding progress.

        On success the response sets an **HttpOnly, Secure (prod), SameSite=Strict (prod)**
        cookie named `openiv_sid` holding the opaque session token. The response body only
        carries the session `state`; the token is never returned in the body.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session issued (see Set-Cookie)
          headers:
            Set-Cookie:
              description: 'openiv_sid=<opaque>; HttpOnly; Secure; SameSite=Strict; Path=/'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/AuthError' }
        '423': { $ref: '#/components/responses/AuthError' }

  /api/v1/auth/email/resend:
    post:
      tags: [Auth — Onboarding]
      summary: Resend the email verification code for the current session
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      responses:
        '204': { description: Code sent }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/AuthError' }

  /api/v1/auth/email/verify:
    post:
      tags: [Auth — Onboarding]
      summary: Verify the 6-digit email code; advances session state
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodeRequest' }
      responses:
        '200':
          description: Email verified; see state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionStateResponse' }
        '400': { $ref: '#/components/responses/AuthError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/totp/enroll:
    post:
      tags: [Auth — Onboarding]
      summary: Enroll TOTP; returns a new secret + otpauth URI
      description: The client renders the otpauth URI as a QR for the authenticator app.
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      responses:
        '200':
          description: Enrolled (not yet verified)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpEnrollment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/AuthError' }

  /api/v1/auth/totp/verify:
    post:
      tags: [Auth — Onboarding]
      summary: Verify a TOTP code; activates TOTP on first use, else completes login
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodeRequest' }
      responses:
        '200':
          description: Session now authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionStateResponse' }
        '400': { $ref: '#/components/responses/AuthError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/password/change:
    post:
      tags: [Auth — Password]
      summary: Change password (requires authenticated session)
      description: Revokes all other sessions for the user.
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200': { description: Password changed }
        '400': { $ref: '#/components/responses/AuthError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/AuthError' }

  /api/v1/auth/password/reset/request:
    post:
      tags: [Auth — Password]
      summary: Step 1 — request a reset code (public)
      description: |
        Always returns 200 whether or not the email exists, to avoid user enumeration.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '200': { description: If the email is registered, a reset code has been sent }

  /api/v1/auth/password/reset/verify:
    post:
      tags: [Auth — Password]
      summary: Step 2 — verify the 6-digit code, receive a short-lived reset token
      description: |
        Consumes the emailed code and returns an opaque `resetToken` (TTL ≈ 10 min) that must
        be supplied to `/password/reset/confirm` to finalize the reset.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetVerifyRequest' }
      responses:
        '200':
          description: Reset token issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResetVerifyResponse' }
        '400': { $ref: '#/components/responses/AuthError' }

  /api/v1/auth/password/reset/confirm:
    post:
      tags: [Auth — Password]
      summary: Step 3 — finalize password reset with the resetToken and a new password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetConfirmRequest' }
      responses:
        '200': { description: Password reset }
        '400': { $ref: '#/components/responses/AuthError' }
        '422': { $ref: '#/components/responses/AuthError' }

  /api/v1/auth/session:
    get:
      tags: [Auth — Session]
      summary: Current session state
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      responses:
        '200':
          description: Session info
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionStateResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/logout:
    post:
      tags: [Auth — Session]
      summary: Revoke the current session
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/team/members:
    get:
      tags: [Team Management]
      summary: List active members in the caller's institution
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/TeamMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/team/members/{id}:
    delete:
      tags: [Team Management]
      summary: Remove (soft-delete) a member from the caller's institution
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Removed }
        '403': { $ref: '#/components/responses/AuthError' }
        '409': { $ref: '#/components/responses/AuthError' }

  /api/v1/team/pending:
    get:
      tags: [Team Management]
      summary: List pending invitations for the caller's institution
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [pending]
                properties:
                  pending:
                    type: array
                    items: { $ref: '#/components/schemas/TeamPending' }

  /api/v1/team/pending/{id}:
    delete:
      tags: [Team Management]
      summary: Revoke a pending invitation
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Revoked }

  /api/v1/team/pending/{id}/resend:
    post:
      tags: [Team Management]
      summary: Rotate the invite code on a pending invitation and re-send
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Re-sent }

  /api/v1/team/invite:
    post:
      tags: [Team Management]
      summary: Invite a teammate (creates an invitation in the caller's institution)
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { $ref: '#/components/schemas/TeamRoleId' }
      responses:
        '200':
          description: Invitation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamPending' }
        '400': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '409': { $ref: '#/components/responses/AuthError' }

  /api/v1/team/roles:
    get:
      tags: [Team Management]
      summary: List the canonical roles (static; six values)
      security: [ { cookieAuth: [] }, { bearerAuth: [] } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items: { $ref: '#/components/schemas/TeamRole' }

components:
  securitySchemes:
    # Primary: HttpOnly session cookie set on /auth/login.
    cookieAuth:
      type: apiKey
      in: cookie
      name: openiv_sid
    # Fallback: Bearer token — used by Swagger "Try it" / CLI / mobile clients.
    bearerAuth:
      type: http
      scheme: bearer

  responses:
    AuthError:
      description: Auth error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Unauthorized:
      description: Missing or invalid session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }

  schemas:
    HealthStatus:
      type: object
      required: [status, timestamp]
      properties:
        status: { type: string, example: alive }
        timestamp: { type: string, format: date-time }

    InviteVerifyRequest:
      type: object
      required: [inviteCode]
      properties:
        inviteCode: { type: string, example: ABCD-EFGH-JKMN-PQRS }

    InviteVerifyResponse:
      type: object
      required: [email, accountType]
      properties:
        email: { type: string, description: 'Masked email (e.g. d***@openiv.local)' }
        accountType: { $ref: '#/components/schemas/AccountType' }

    AccountType:
      type: string
      description: Every user has exactly one of these.
      enum: [INDIVIDUAL, COMPANY, REGULATOR]

    AccessRequestSubmit:
      type: object
      required: [institutionName, institutionType, contactName, contactEmail]
      properties:
        institutionName: { type: string, maxLength: 200 }
        institutionType: { $ref: '#/components/schemas/AccountType' }
        contactName: { type: string, maxLength: 200 }
        contactEmail: { type: string, format: email, maxLength: 320 }
        contactPhone: { type: string, maxLength: 40 }
        description: { type: string, maxLength: 2000 }

    AccessRequestAck:
      type: object
      required: [id, status]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, example: pending }

    TeamRoleId:
      type: string
      enum: [admin, cco, analyst, developer, viewer, regulator]

    TeamRole:
      type: object
      required: [id, name, description, color]
      properties:
        id: { $ref: '#/components/schemas/TeamRoleId' }
        name: { type: string }
        description: { type: string }
        color: { type: string, example: '#1e40af' }

    TeamMember:
      type: object
      required: [id, email, name, initials, role, status]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        name: { type: string }
        initials: { type: string, example: 'AC' }
        role: { $ref: '#/components/schemas/TeamRoleId' }
        status: { type: string, enum: [pending, active, disabled, locked] }
        accountType: { $ref: '#/components/schemas/AccountType' }
        emailVerified: { type: boolean }
        lastActive: { type: string, example: '12 min ago' }
        createdAt: { type: string, format: date-time }

    TeamPending:
      type: object
      required: [id, email, role]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        role: { $ref: '#/components/schemas/TeamRoleId' }
        invitedBy: { type: string }
        invitedOn: { type: string, example: '2 days ago' }
        expiresAt: { type: string, format: date-time }
        status: { type: string, enum: [pending, accepted, revoked, expired] }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        inviteCode:
          type: string
          description: Present on first login only; claims the invitation.

    LoginResponse:
      type: object
      required: [state, accountType]
      properties:
        state: { $ref: '#/components/schemas/SessionStateEnum' }
        accountType: { $ref: '#/components/schemas/AccountType' }

    CodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }

    SessionStateResponse:
      type: object
      required: [state]
      properties:
        state: { $ref: '#/components/schemas/SessionStateEnum' }
        accountType: { $ref: '#/components/schemas/AccountType' }
        email: { type: string }

    TotpEnrollment:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret: { type: string, description: 'Base32, 160 bits' }
        otpauthUri: { type: string, description: 'otpauth:// URI for QR rendering' }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8 }

    EmailRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetVerifyRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email }
        code: { type: string, pattern: '^[0-9]{6}$' }

    ResetVerifyResponse:
      type: object
      required: [resetToken]
      properties:
        resetToken: { type: string, description: 'Opaque token, ~10 min TTL' }

    ResetConfirmRequest:
      type: object
      required: [email, resetToken, newPassword]
      properties:
        email: { type: string, format: email }
        resetToken: { type: string }
        newPassword: { type: string, minLength: 8 }

    SessionStateEnum:
      type: string
      enum:
        - pending_email_verification
        - pending_totp_setup
        - pending_totp_challenge
        - authenticated

    ErrorBody:
      type: object
      required: [error, correlationId]
      properties:
        error: { type: string, example: invalid }
        detail: { type: string, example: code }
        correlationId: { type: string, format: uuid }
